name: Deploy Production to Firebase App Distribution

on:
  push:
    branches:
      - dev # أو main حسب الفرع المعتمد لديك للنشر

jobs:
  deploy-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Production APK
        run: ./gradlew assembleProdRelease

      - name: Upload to Firebase App Distribution
        uses: firebaseextended/action-upload-firebase-app-distribution@v1
        with:
          app: ${{ secrets.FIREBASE_APP_ID }}
          serviceAccountCredentials: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: app/build/outputs/apk/prod/release/app-prod-release.apk
          testers: "zonesmart630@gmail.com"
          releaseNotes: "Production release deployed automatically via GitHub Actions (No tests executed)."