name: Android CI/CD Pipeline

on:
  push:
    branches:
      - main     # أو master (الفرع الأساسي للنشر)
  pull_request:
    branches:
      - main     # يتم تشغيل الـ Tests فقط عند عمل Pull Request للتأكد من سلامة الكود

jobs:
  # ==========================================
  # الخطوة الأولى: الـ CI (تشغيل ملفات الـ Testing)
  # ==========================================
  ci-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # تشغيل كل الـ Unit Tests الموجودة في المشروع
      - name: Run Gradle Unit Tests
        run: ./gradlew test

  # ==========================================
  # الخطوة الثانية: الـ CD (البناء والرفع لـ Firebase)
  # ==========================================
  cd-deploy:
    name: Build & Deploy to Firebase
    needs: ci-tests                    # لا يبدأ إلا بعد نجاح الـ Tests في الخطوة السابقة
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # يتم الرفع فقط عند الـ Push المباشر للـ main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          serviceAccountJson: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          appId: ${{ secrets.FIREBASE_APP_ID }}
          file: app/build/outputs/apk/debug/app-debug.apk
          groups: testers-group # اسم المجموعه أو الإيميلات في Firebase App Distribution
          releaseNotes: "Automated build from GitHub Actions (Commit: ${{ github.sha }})"